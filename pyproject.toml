[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devx"
version = "0.1.0"
description = "A minimal devx command-line tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
devx = "devx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
